name: Publish Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and strip 'v'
        id: get_version
        run: |
          # Get the tag name (e.g., v1.0.0)
          TAG_NAME=${{ github.ref_name }}
          # Strip the leading 'v' if present (e.g., 1.0.0)
          VERSION=${TAG_NAME#v}
          echo "CLEAN_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version to use: $VERSION"

      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.CLEAN_VERSION }}
          build-args: |
            VERSION=${{ env.CLEAN_VERSION }}